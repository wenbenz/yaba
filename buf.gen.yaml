version: v2
clean: true
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: yaba/gen
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.21.1
    out: gen
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.17.0
    out: ui/gen
    opt: target=ts
    include_imports: true
  - remote: buf.build/bufbuild/es:v2.17.0
    out: web/src/gen
    opt: target=ts
    include_imports: true

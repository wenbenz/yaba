# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build and test

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  buildAndTest:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'

    - name: Build
      run: make build

    - name: Test
      run: make cover

    - name: Upload Codecov report
      uses: codecov/codecov-action@v6.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'

    - name: Lint
      uses: golangci/golangci-lint-action@v9.2.0

  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
        cache: 'yarn'
        cache-dependency-path: ui/yarn.lock
    - run: yarn install --frozen-lockfile
    - run: yarn lint
    - run: yarn test
    - run: yarn build

  docker:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to Docker Hub
      if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: wenbenz/yaba
        tags: |
          type=semver,pattern={{version}}
          type=sha,format=long
          type=raw,value=latest,enable={{is_default_branch}}
    - name: Build for smoke test
      uses: docker/build-push-action@v7.1.0
      with:
        platforms: linux/amd64
        load: true
        tags: yaba:smoke
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Smoke test
      run: |
        docker network create smoke
        docker run -d --name db --network smoke -e POSTGRES_DB=yaba -e POSTGRES_USER=yaba \
          -e POSTGRES_PASSWORD=smoke postgres:16
        printf smoke > "$RUNNER_TEMP/pw" && chmod 644 "$RUNNER_TEMP/pw"
        docker run -d --name app --network smoke -p 8080:80 -e POSTGRES_DB=yaba -e POSTGRES_USER=yaba \
          -e POSTGRES_URL=db:5432 -e POSTGRES_SSL_MODE=disable -e POSTGRES_PASSWORD_FILE=/pw \
          -v "$RUNNER_TEMP/pw:/pw:ro" yaba:smoke
        for _ in $(seq 60); do curl -sf localhost:8080/api/health && break; sleep 2; done
        curl -sf localhost:8080/api/health
        curl -sf localhost:8080/ | grep -q 'id="root"'
        curl -sf localhost:8080/profile | grep -q 'id="root"'
        asset=$(curl -sf localhost:8080/ | grep -oE '/assets/[^"]+\.js' | head -1)
        curl -sf -o /dev/null "localhost:8080$asset"
        test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/nope)" = 404
    - name: Smoke test logs
      if: failure()
      run: docker logs app; docker logs db
    - name: Build and push
      uses: docker/build-push-action@v7.1.0
      with:
        platforms: linux/amd64,linux/arm64
        push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
